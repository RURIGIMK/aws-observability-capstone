AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Duka observability capstone - application tier. ECS Fargate service running the Duka API with
  an AWS X-Ray daemon sidecar. Container logs go to CloudWatch Logs via the awslogs driver and
  Container Insights publishes per-task CPU/memory.

Parameters:
  Project:
    Type: String
    Default: duka
  DesiredCount:
    Type: Number
    Default: 1

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${Project}-cluster'
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/${Project}/app', RetentionInDays: 7 }
  XrayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/${Project}/xray-daemon', RetentionInDays: 3 }

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: db-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: { 'Fn::ImportValue': !Sub '${Project}-DBSecretArn' }
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Project}-api'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub
            - '${Repo}:latest'
            - Repo: { 'Fn::ImportValue': !Sub '${Project}-RepoUri' }
          Essential: true
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - { Name: DB_HOST, Value: { 'Fn::ImportValue': !Sub '${Project}-DBEndpoint' } }
            - { Name: DB_NAME, Value: duka }
            - { Name: AWS_XRAY_DAEMON_ADDRESS, Value: '127.0.0.1:2000' }
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub ['${Arn}:username::', { Arn: { 'Fn::ImportValue': !Sub '${Project}-DBSecretArn' } }]
            - Name: DB_PASSWORD
              ValueFrom: !Sub ['${Arn}:password::', { Arn: { 'Fn::ImportValue': !Sub '${Project}-DBSecretArn' } }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
        - Name: xray-daemon
          Image: public.ecr.aws/xray/aws-xray-daemon:latest
          Essential: false
          Cpu: 32
          MemoryReservation: 64
          PortMappings: [{ ContainerPort: 2000, Protocol: udp }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref XrayLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: xray

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${Project}-api'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [',', { 'Fn::ImportValue': !Sub '${Project}-PublicSubnets' }]
          SecurityGroups: [{ 'Fn::ImportValue': !Sub '${Project}-AppSG' }]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: { 'Fn::ImportValue': !Sub '${Project}-AppTG' }

Outputs:
  ClusterName: { Value: !Ref Cluster, Export: { Name: !Sub '${Project}-Cluster' } }
  ServiceName: { Value: !GetAtt Service.Name, Export: { Name: !Sub '${Project}-Service' } }
  AppLogGroupName: { Value: !Ref AppLogGroup, Export: { Name: !Sub '${Project}-AppLogGroup' } }
